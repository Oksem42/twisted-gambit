<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gerasimos Gambit</title>
  <meta name="description" content="Real chess with secret twists: Secret Queen, Traitor, Hidden Objective and Secret Swap. Play on one device or online.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♞</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar">
    <a class="logo" href="./" aria-label="Gerasimos Gambit home">
      <span class="logo-mark" id="logo-mark"></span>
      <span class="logo-text">Gerasimos<b>Gambit</b></span>
    </a>
    <nav class="side-nav">
      <button class="side-item active" data-nav="play"><span class="si-ic" id="nav-ic-play"></span><span>Play</span></button>
      <button class="side-item" data-nav="new"><span class="si-ic plus">+</span><span>New Game</span></button>
      <button class="side-item" data-nav="online"><span class="si-ic globe">🌐</span><span>Play Online</span></button>
      <button class="side-item" data-nav="rules"><span class="si-ic book">?</span><span>Rules</span></button>
      <a class="side-item" href="https://github.com/Oksem42/twisted-gambit" target="_blank" rel="noopener"><span class="si-ic code">&lt;/&gt;</span><span>Source</span></a>
    </nav>
    <div class="side-foot">
      <button class="btn primary side-cta" data-nav="new">Play Now</button>
      <button class="side-item small" id="sound-toggle"><span class="si-ic snd" id="sound-ic">🔊</span><span id="sound-label">Sound on</span></button>
    </div>
  </aside>

  <main class="layout">
    <section class="board-col">
      <div class="player-bar" id="bar-top"></div>
      <div class="board-wrap" id="board-wrap">
        <div id="board" class="board" aria-label="Chess board"></div>
        <div id="promo" class="promo hidden"></div>
        <div id="board-modal" class="board-modal hidden"></div>
      </div>
      <div class="player-bar" id="bar-bottom"></div>
    </section>
    <aside class="panel" id="panel"></aside>
  </main>

  <div id="overlay" class="overlay hidden"></div>
  <div id="modal" class="modal-backdrop hidden"></div>
  <div id="drag-ghost" class="pc drag-ghost hidden"></div>

  <!-- PeerJS (MIT) connects two browsers directly for online play -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/pieces.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
