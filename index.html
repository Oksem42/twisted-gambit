<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gerasimos Gambit</title>
  <meta name="description" content="Real chess with secret twists: Secret Queen, Traitor, Hidden Objective and Secret Swap. Play on one device or online.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cg fill='%2381b64c' stroke='%231e2a14' stroke-width='4' stroke-linejoin='round'%3E%3Cpath d='M31 80C30 68 38 61 47 55C41 58 35 60 29 61C22 62 17 57 18 51C19 45 25 40 31 33C37 26 42 21 48 19L52 9L59 18C66 17 71 21 71 26C77 27 80 33 77 38C83 41 84 49 80 53C85 59 83 69 77 71L75 80Z'/%3E%3Crect x='22' y='76' width='56' height='12' rx='5'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar">
    <a class="logo" href="./" aria-label="Gerasimos Gambit home">
      <span class="logo-mark" id="logo-mark"></span>
      <span class="logo-text">Gerasimos<b>Gambit</b></span>
    </a>
    <nav class="side-nav">
      <button class="side-item active" data-nav="play"><span class="si-ic" id="nav-ic-play"></span><span>Play</span></button>
      <button class="side-item" data-nav="new"><span class="si-ic plus" id="nav-ic-new"></span><span>New Game</span></button>
      <button class="side-item" data-nav="online"><span class="si-ic globe" id="nav-ic-online"></span><span>Play Online</span></button>
      <button class="side-item" data-nav="rules"><span class="si-ic book" id="nav-ic-rules"></span><span>Rules</span></button>
    </nav>
    <div class="side-foot">
      <button class="btn primary side-cta" data-nav="new">Play Now</button>
      <button class="side-item small" id="sound-toggle"><span class="si-ic snd" id="sound-ic"></span><span id="sound-label">Sound on</span></button>
    </div>
  </aside>

  <main class="layout">
    <section class="board-col">
      <div class="player-bar" id="bar-top"></div>
      <div class="board-wrap" id="board-wrap">
        <div id="board" class="board" aria-label="Chess board"></div>
        <div id="promo" class="promo hidden"></div>
        <div id="spin" class="spin hidden"></div>
        <div id="mg" class="mg hidden"></div>
        <div id="board-modal" class="board-modal hidden"></div>
      </div>
      <div class="player-bar" id="bar-bottom"></div>
    </section>
    <aside class="panel" id="panel"></aside>
  </main>

  <div id="overlay" class="overlay hidden"></div>
  <div id="modal" class="modal-backdrop hidden"></div>
  <div id="drag-ghost" class="pc drag-ghost hidden"></div>

  <!-- PeerJS (MIT) connects two browsers directly for online play -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/pieces.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/bot.js"></script>
  <script src="js/jules.js"></script>
  <script src="js/relay.js"></script>
  <script src="js/minigames.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
